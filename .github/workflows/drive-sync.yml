name: Sync depuis Google Drive

# Va chercher automatiquement les nouveaux fichiers (Réalisé / EF) dans les
# dossiers Google Drive de chaque concessionnaire (via un compte de service,
# secret GDRIVE_SA_KEY) et les dépose dans sources/. Le simple fait de
# pousser un changement dans sources/** déclenche ensuite automatiquement
# "Update dashboard" (update-dashboard.yml) grâce à son filtre de chemin --
# aucune autre action n'est nécessaire ici.
on:
  schedule:
    # Toutes les 6 heures. Ajustable au besoin (format cron standard, UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Synchroniser sources/ depuis Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: python src/drive_sync.py

      - name: Commit et push si de nouveaux fichiers sont arrivés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources/
          if git diff --staged --quiet; then
            echo "Aucun nouveau fichier depuis Google Drive."
          else
            git commit -m "Sync automatique des fichiers Drive"
            git push
          fi
