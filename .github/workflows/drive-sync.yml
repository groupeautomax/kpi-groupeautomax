name: Sync depuis Google Drive

# Va chercher automatiquement les nouveaux fichiers (Réalisé / EF) dans les
# dossiers Google Drive de chaque concessionnaire (via un compte de service
# avec délégation à l'échelle du domaine, secret GDRIVE_SA_KEY) et les
# dépose dans sources/.
#
# Important : le push fait par ce workflow utilise le GITHUB_TOKEN par
# défaut. GitHub empêche volontairement un push fait avec ce token de
# déclencher un autre workflow "on: push" (pour éviter les boucles infinies)
# -- donc "Update dashboard" (update-dashboard.yml), même avec son filtre
# sources/**, ne se déclencherait PAS automatiquement après ce push. C'est
# pourquoi la dernière étape ci-dessous déclenche explicitement
# update-dashboard.yml via l'API GitHub (gh workflow run) quand de nouveaux
# fichiers sont arrivés.
on:
  schedule:
    # Toutes les 6 heures. Ajustable au besoin (format cron standard, UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Synchroniser sources/ depuis Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: python src/drive_sync.py

      - name: Commit et push si de nouveaux fichiers sont arrivés
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources/
          if git diff --staged --quiet; then
            echo "Aucun nouveau fichier depuis Google Drive."
            echo "new_files=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync automatique des fichiers Drive"
            git push
            echo "new_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Déclencher la reconstruction du tableau de bord
        if: steps.commit.outputs.new_files == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-dashboard.yml --ref main
