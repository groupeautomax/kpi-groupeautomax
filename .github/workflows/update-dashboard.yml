name: Update dashboard

# Re-extracts KPI data and republishes the dashboard whenever a new monthly
# source file lands in sources/ -- this is the self-service update path
# described on the site's "Déposer un fichier" page. Also runnable by hand
# from the Actions tab (workflow_dispatch) to rebuild without a new file.
on:
  push:
    branches: [main]
    paths:
      - "sources/**"
  workflow_dispatch: {}

# HAWKS sends GM's standardized .xlsm "Composite Financial Statement" export
# instead of the .xlsx template every other dealer uses -- extract.py already
# dispatches on extension (see extract_any_file), so the only change needed
# here is to also glob .xlsm files into the extraction step below.

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Extract data from all source files
        run: |
          shopt -s nullglob
          files=(sources/*.xlsx sources/*.xlsm)
          python src/extract.py "${files[@]}"

      - name: Rebuild dashboard
        run: python src/build_dashboard.py index.html

      - name: Commit and push if the dashboard changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Mise à jour automatique des données KPI"
            # Un autre commit a pu arriver sur main pendant la reconstruction
            # (~40 min : synchro Drive, dépôt de code) : on se replace dessus
            # avant de pousser. Seuls index.html et data/data.json sont
            # commités ici, et une seule reconstruction tourne à la fois
            # (concurrency), donc pas de conflit possible.
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                exit 0
              fi
              echo "Push refusé, nouvelle tentative ($i/3)"
              sleep 15
            done
            exit 1
          fi
